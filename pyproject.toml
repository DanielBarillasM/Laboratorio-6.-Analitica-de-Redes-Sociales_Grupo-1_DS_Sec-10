[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab6-social-analytics"
version = "0.1.0"
description = "Avance reproducible del Laboratorio 6 de analítica de redes sociales en YouTube."
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "networkx>=3.3",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "seaborn>=0.13",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

